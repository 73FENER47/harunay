
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harun Ay | Sosyal Medya</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: white;
      background: radial-gradient(ellipse at top, #25253d, #09090d 65%);
    }

    .container {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }

    .avatar {
      width: 95px;
      height: 95px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border: 1px solid #55556e;
      border-radius: 50%;
      background: #202033;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 4px;
    }

    .subtitle {
      color: #aaaabb;
      margin: 14px 0 30px;
    }

    .social-link {
      display: block;
      padding: 17px;
      margin: 14px 0;
      border: 1px solid #333342;
      border-radius: 14px;
      background: #191921;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      transition: 0.2s;
    }

    .social-link:hover {
      background: #303047;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 32px;
      color: #707080;
      font-size: 11px;
      letter-spacing: 3px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="avatar">HA</div>

    <h1>HARUN AY</h1>
    <p class="subtitle">Beni sosyal medyada bul.</p>

    <a class="social-link"
       href="https://www.instagram.com/harun7_3/"
       target="_blank" rel="noopener noreferrer">
      ◎ Instagram
    </a>

    <a class="social-link"
       href="https://www.tiktok.com/@harun250sr"
       target="_blank" rel="noopener noreferrer">
      ♪ TikTok
    </a>

    <a class="social-link"
       href="https://www.snapchat.com/add/harun7_3"
       target="_blank" rel="noopener noreferrer">
      ◉ Snapchat
    </a>

    <footer>HARUN AY · OFFICIAL</footer>
  </main>
</body>
</html>
